seed: 42
features: data/processed/mitdb_features_v1.csv.gz
cv:
  n_splits: 5
# Les clés correspondent aux arguments des constructeurs
models:
  logreg: {C: 1.0, max_iter: 2000}
  rf: {n_estimators: 300, min_samples_leaf: 2, n_jobs: -1}
  svm: {C: 1.0, gamma: scale, cap_per_class: 4000}
  xgb: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8}
output:
  tables: reports/tables